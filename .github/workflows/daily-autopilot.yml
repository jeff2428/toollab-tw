name: Daily Affiliate Matrix Autopilot

on:
  schedule:
    # 每日台灣時間 09:00 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: autopilot-daily
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install OG & Carousel image renderer + CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Install dependencies
        run: npm ci

      - name: Resolve site URL and base path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          DEFAULT_URL="https://${OWNER}.github.io"
          DEFAULT_BASE="/${REPO}"
          SITE_URL_VAL="${{ vars.SITE_URL }}"
          SITE_BASE_VAL="${{ vars.SITE_BASE_PATH }}"
          if [ -z "$SITE_URL_VAL" ]; then SITE_URL_VAL="$DEFAULT_URL"; fi
          if [ -z "$SITE_BASE_VAL" ] && [ "$SITE_URL_VAL" = "$DEFAULT_URL" ]; then SITE_BASE_VAL="$DEFAULT_BASE"; fi
          echo "SITE_URL=$SITE_URL_VAL" >> "$GITHUB_ENV"
          echo "SITE_BASE_PATH=$SITE_BASE_VAL" >> "$GITHUB_ENV"

      - name: Run full multi-site autopilot pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: node scripts/run-pipeline.mjs --all-sites --check-urls

      - name: Commit updated sites and reports
        run: |
          git config user.name "ToolLab-Autopilot[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/ reports/ config/
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): daily matrix content, SEO & social update [skip ci]"
            git push
          else
            echo "No repository changes to commit."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check Cloudflare Pages configuration
        id: check_cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages (Optional)
        if: steps.check_cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'toollab-tw' }}

      - name: Open or update alert issue when attention needed
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alertPath = 'reports/alert-issue.md';
            const jobFailed = '${{ job.status }}' === 'failure';
            const hasAlertFile = fs.existsSync(alertPath);
            if (!jobFailed && !hasAlertFile) return;

            const body = hasAlertFile
              ? fs.readFileSync(alertPath, 'utf8')
              : `Daily Matrix Autopilot failed (${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

            const title = '[Autopilot Alert] 矩陣系統需要人工確認或金鑰更新';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'needs-attention',
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['needs-attention'],
              });
            }
